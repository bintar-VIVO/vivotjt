<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VIVO TJT — Sales Monitoring</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0050D8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VIVO TJT">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #091124;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #splashOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0050D8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
      color: #FFFFFF;
    }
    .splash-logo {
      width: 180px;
      max-width: 65%;
      margin-bottom: 20px;
    }
    .splash-badge {
      background: rgba(255, 255, 255, 0.22);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 5px 16px;
      border-radius: 6px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Clean App Splash Screen -->
  <div id="splashOverlay">
    <img class="splash-logo" src="./icon-192.png" alt="VIVO TJT">
    <div class="splash-badge">TJT TIMUR</div>
    <div class="spinner"></div>
  </div>

  <!-- Fullscreen Web App Frame (Replace with your Google Sites or Web App URL) -->
  <iframe id="appFrame" 
          src="https://sites.google.com/view/vivo-tjt-timur-monitoring-apps/home" 
          allow="clipboard-read; clipboard-write; camera;" 
          onload="hideSplash()">
  </iframe>

  <script>
    // Register Service Worker for PWA installation
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          console.log('PWA ServiceWorker registered with scope:', reg.scope);
        }).catch(function(err) {
          console.log('PWA ServiceWorker registration failed:', err);
        });
      });
    }

    function hideSplash() {
      const splash = document.getElementById('splashOverlay');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 400);
      }
    }

    // Fallback if iframe onload takes long
    setTimeout(hideSplash, 3500);
  </script>
</body>
</html>
